name: API Contract Guard

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  api-contract-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prevent local API DTO duplication
        run: node scripts/check-api-contract.mjs
